name: Kiểm tra app
on:
  pull_request:
  push:
    branches: [main]
jobs:
  # PR từ form đóng góp (/api/dong-gop) chỉ vá prov-data.js + prov-data.gon.js:
  # job này sinh lại prov-data.gon.js + 34 trang tĩnh tỉnh từ dữ liệu mới rồi đẩy
  # lên đúng nhánh PR, để job kiem-tra (so khớp trang tĩnh + gon) luôn xanh.
  # Push bằng GITHUB_TOKEN không kích hoạt workflow mới nên không lặp vô hạn.
  sinh-gon:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sinh lại bản gọn + trang tĩnh tỉnh
        if: github.event_name == 'pull_request'
        run: |
          node tools/tao-ban-gon.mjs
          node tools/tao-trang-tinh.mjs
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/data/prov-data.gon.js app/tinh/ app/sitemap.xml app/robots.txt app/index.html
            git commit -m "Sinh lại prov-data.gon.js + trang tĩnh (CI)"
            git push
          fi
  kiem-tra:
    needs: sinh-gon
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Kiểm dữ liệu
        run: node du-lieu.mjs
      - name: Kiểm FAQ còn khớp nguồn hoi-dap.js
        run: node ../tools/tao-faq.mjs --kiem
      - name: Bản dữ liệu gọn còn khớp bản gốc
        run: node ../tools/tao-ban-gon.mjs --kiem
      - name: Chấm trợ lý (1.014 giả thiết, 120 câu live, 20 câu ngoài dữ liệu, bộ sinh ≥ 10.000 câu)
        run: node hypotheses/generate.mjs && node hypotheses/run.mjs --in-loi 30
      - name: Stress-test trợ lý AI (ST-01..ST-05, parity Python/JS)
        run: |
          cd ../tools/buitrip-ai && python3 test_stress.py
          cd js-port && node test_stress.mjs
      - name: Cài trình duyệt
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Kiểm trên trình duyệt
        run: node trinh-duyet.mjs
