name: Kiểm tra app
on:
  pull_request:
  push:
    branches: [main]
jobs:
  kiem-tra:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Kiểm dữ liệu
        run: node du-lieu.mjs
      - name: Kiểm FAQ còn khớp nguồn hoi-dap.js
        run: node ../tools/tao-faq.mjs --kiem
      - name: Bản dữ liệu gọn còn khớp bản gốc
        run: node ../tools/tao-ban-gon.mjs --kiem
      - name: Chấm trợ lý (1.014 giả thiết, 120 câu live, 20 câu ngoài dữ liệu, bộ sinh ≥ 10.000 câu)
        run: node hypotheses/generate.mjs && node hypotheses/run.mjs --in-loi 30
      - name: Cài trình duyệt
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Kiểm trên trình duyệt
        run: node trinh-duyet.mjs
